name: Tests

# Menjalankan unit test pada SETIAP push (semua branch, termasuk push otomatis dari
# scripts/auto-commit-push.mjs) dan pada setiap pull request.
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Hanya agar `prisma generate` (postinstall) punya nilai; tes tidak menyentuh database.
      DATABASE_URL: postgresql://user:password@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
